name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile MCP server
        run: python -m py_compile plugins/matlab-r2026a/scripts/matlab_mcp_server.py
      - name: Run unit and repository tests
        run: python -m unittest discover -s tests -v
